<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tigu.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7c6af7;
      --accent2: #3ecfcf;
      --text: #e2e0f0;
      --muted: #5a5870;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 2rem;
      text-align: center;
    }

    .badge {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--accent2);
      text-transform: uppercase;
      border: 1px solid rgba(62,207,207,0.3);
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.1s;
    }

    .logo {
      font-family: var(--mono);
      font-weight: 600;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.25s;
    }

    .logo span.domain { color: var(--text); }
    .logo span.tld {
      color: var(--accent);
      position: relative;
    }
    .logo span.tld::after {
      content: '';
      position: absolute;
      bottom: 0.05em;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      animation: lineGrow 0.8s ease both;
      animation-delay: 0.8s;
      transform-origin: left;
    }
    @keyframes lineGrow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .headline {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 3.5rem;
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.4s;
      letter-spacing: 0.02em;
    }

    .progress-wrap {
      width: min(380px, 90vw);
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.55s;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
      letter-spacing: 0.08em;
    }

    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 42%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      animation: loadBar 2s cubic-bezier(0.4, 0, 0.2, 1) both;
      animation-delay: 1s;
    }
    @keyframes loadBar {
      from { width: 0; }
      to { width: 42%; }
    }

    .terminal {
      margin-top: 3rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      animation: fadeUp 0.6s ease both;
      animation-delay: 0.7s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.1em;
      background: var(--accent2);
      vertical-align: middle;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .sub-link {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.2s;
      animation: fadeUp 0.6s ease both;
      animation-delay: 1.1s;
    }
    .sub-link:hover { color: var(--accent); }
    .sub-link span { color: var(--accent); }

    .logo-img {
      position: fixed;
      bottom: 1.2rem;
      right: 1.8rem;
      width: 80px;
      opacity: 0.75;
      animation: fadeUp 0.6s ease both;
      animation-delay: 1s;
      transition: opacity 0.2s;
    }
    .logo-img:hover { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

      <div class="progress-bar"></div>
    </div>

    <div class="terminal">
      <span>$ npm run build</span>
      <span class="cursor"></span>
    </div>
  </div>
